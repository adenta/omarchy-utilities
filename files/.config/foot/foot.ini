[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=8
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+c Control+Insert XF86Copy
primary-paste=none
clipboard-paste=Control+v Shift+Insert Control+Shift+v XF86Paste
# Foot cannot visually select all; copy the entire retained transcript instead.
pipe-scrollback=[wl-copy] Control+a

[text-bindings]
# Keep terminal interrupt available after using Control+C for copy.
\x03=Control+Shift+c
# Preserve the shell's quoted-insert function on Control+Alt+V.
\x16=Control+Alt+v
# Preserve the shell's beginning-of-line function on Control+Shift+A.
\x01=Control+Shift+a
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
