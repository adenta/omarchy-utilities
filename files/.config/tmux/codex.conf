# Dedicated shortcuts for the local Codex terminal. Loaded by ~/.bashrc.
source-file ~/.config/tmux/tmux.conf
set -g status off
# Let the wheel scroll tmux history. Shift+drag uses native terminal selection.
set -g mouse on
# Keep a dragged selection for Ctrl+C instead of copying on release.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
set -g destroy-unattached on
set -g history-limit 100000

# Use the desktop clipboard directly. Shift+drag keeps native Codex selection.
set -s set-clipboard off
set -s copy-command '"$HOME/.local/libexec/codex-terminal-clipboard" copy'

# Selecting never writes to either clipboard or tmux paste buffers.
bind-key -N "Select terminal transcript" -n C-a {
  copy-mode
  send-keys -X history-top
  send-keys -X start-of-line
  send-keys -X begin-selection
  send-keys -X history-bottom
  send-keys -X end-of-line
}
bind-key -T copy-mode-vi C-a {
  send-keys -X history-top
  send-keys -X start-of-line
  send-keys -X begin-selection
  send-keys -X history-bottom
  send-keys -X end-of-line
}

# Without a selection, Ctrl+C reaches the foreground program normally.
unbind-key -n C-c
bind-key -N "Interrupt foreground process" -n M-c send-keys C-c
bind-key -T copy-mode-vi C-c if-shell -F '#{selection_present}' {
  send-keys -X copy-pipe-and-cancel
} {
  send-keys -X cancel
  send-keys C-c
}
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Every paste has its own buffer and an explicit destination pane.
bind-key -N "Paste system clipboard" -n C-v run-shell -b '"$HOME/.local/libexec/codex-terminal-clipboard" paste "#{socket_path}" "#{pane_id}"'
bind-key -T copy-mode-vi C-v {
  send-keys -X cancel
  run-shell -b '"$HOME/.local/libexec/codex-terminal-clipboard" paste "#{socket_path}" "#{pane_id}"'
}
