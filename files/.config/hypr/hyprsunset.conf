# Night Light follows darkman's sunrise/sunset events.
# ~/.local/share/darkman/omarchy-nightlight applies 4000 K at sunset and
# normal 6500 K colors at sunrise through the Omarchy night-light service.
# The post-boot sync-nightlight hook applies the current mode after login.
#
# Keep this file free of fixed-time profiles: they would override the solar
# schedule. Omarchy starts hyprsunset as needed and sets its temperature.
