# Source: https://github.com/adenta/omarchy-utilities/tree/main/examples/remote-codex-terminal
# One server and one fresh session per Codex terminal.
set-option -g default-shell /bin/bash
set-option -g default-command ''
set-option -g destroy-unattached on
set-option -g history-limit 100000
set-option -s exit-empty on
set-option -s exit-unattached off
# Let the wheel scroll tmux history. Shift+drag uses native terminal selection.
set-option -g mouse on
# Keep a dragged selection for Ctrl+C instead of copying on release.
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
set-option -g status off
set-option -g status-style 'bg=green,fg=black'
set-window-option -g mode-keys emacs

# Codex's clipboard handler requires the explicit system clipboard selector.
# Keep both string parameters for ncurses tiparm_s; replace an empty selector.
set-option -as terminal-overrides ',xterm-256color:Ms=\E]52;%?%p1%l%{0}%=%tc%e%p1%s%;;%p2%s\007'
set-option -s set-clipboard external
set-option -s get-clipboard off

# Select retained transcript only; no copy or clipboard command is invoked.
bind-key -n C-a {
  copy-mode
  send-keys -X history-top
  send-keys -X start-of-line
  send-keys -X begin-selection
  send-keys -X history-bottom
  send-keys -X end-of-line
}
bind-key -T copy-mode C-a {
  send-keys -X history-top
  send-keys -X start-of-line
  send-keys -X begin-selection
  send-keys -X history-bottom
  send-keys -X end-of-line
}
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode C-c if-shell -F '#{selection_present}' {
  send-keys -X copy-selection-and-cancel
} {
  send-keys -X cancel
  send-keys C-c
}

# Consume Ctrl+V here so it never reaches Bash's quoted-insert binding.
bind-key -n C-v if-shell -F '#{@codex_clipboard_disabled}' {
  display-message 'Clipboard unavailable in this terminal; use Ctrl+Shift+V.'
} {
  if-shell -F '#{@codex_clipboard_busy}' {
    display-message 'Waiting for clipboard...'
  } {
    set-option -s @codex_clipboard_busy 1
    run-shell -b '/usr/bin/perl "$HOME/.config/tmux/codex-paste.pl" start "#{socket_path}" "#{pane_id}" "#{client_name}"'
  }
}
bind-key -T copy-mode C-v {
  send-keys -X cancel
  if-shell -F '#{@codex_clipboard_disabled}' {
    display-message 'Clipboard unavailable in this terminal; use Ctrl+Shift+V.'
  } {
    if-shell -F '#{@codex_clipboard_busy}' {
      display-message 'Waiting for clipboard...'
    } {
      set-option -s @codex_clipboard_busy 1
      run-shell -b '/usr/bin/perl "$HOME/.config/tmux/codex-paste.pl" start "#{socket_path}" "#{pane_id}" "#{client_name}"'
    }
  }
}
