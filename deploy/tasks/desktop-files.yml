---
- name: Create parents for managed desktop files
  ansible.builtin.file:
    path: "{{ expected_home }}/{{ item.dest | dirname }}"
    state: directory
  loop: "{{ desktop_files }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Install managed desktop files
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item.source }}"
    dest: "{{ expected_home }}/{{ item.dest }}"
    mode: "{{ item.mode | default('preserve') }}"
  loop: "{{ desktop_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: desktop_file_copies

- name: Remove host-excluded desktop files
  ansible.builtin.file:
    path: "{{ expected_home }}/{{ item.dest }}"
    state: absent
  loop: "{{ desktop_absent_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: desktop_file_removals

- name: Queue Hyprland reload for changed payloads
  ansible.builtin.debug:
    msg: Hyprland payload changed
  changed_when: >-
    (desktop_file_copies.results
     | selectattr('changed')
     | selectattr('item.reload', 'equalto', 'hypr')
     | list | length) > 0
  notify: Reload Hyprland

- name: Queue hyprsunset restart for changed payloads
  ansible.builtin.debug:
    msg: Hyprsunset configuration changed
  changed_when: >-
    (desktop_file_copies.results
     | selectattr('changed')
     | selectattr('item.reload', 'equalto', 'hyprsunset')
     | list | length) > 0
  notify: Restart hyprsunset

- name: Queue Darkman restart for changed payloads
  ansible.builtin.debug:
    msg: Darkman configuration changed
  changed_when: >-
    (desktop_file_copies.results
     | selectattr('changed')
     | selectattr('item.reload', 'equalto', 'darkman')
     | list | length) > 0
  notify: Restart Darkman

- name: Queue backup timer restart for changed payloads
  ansible.builtin.debug:
    msg: Backup units changed
  changed_when: >-
    (desktop_file_copies.results
     | selectattr('changed')
     | selectattr('item.reload', 'equalto', 'backup')
     | list | length) > 0
  notify: Restart backup timer

- name: Queue portal restart for changed payloads
  ansible.builtin.debug:
    msg: GTK portal configuration changed
  changed_when: >-
    (desktop_file_copies.results
     | selectattr('changed')
     | selectattr('item.reload', 'equalto', 'portal')
     | list | length) > 0
  notify: Restart GTK portal

- name: Queue VoxType restart for changed payloads
  ansible.builtin.debug:
    msg: VoxType integration changed
  changed_when: >-
    ((desktop_file_copies.results
      | selectattr('changed')
      | selectattr('item.reload', 'equalto', 'voxtype')
      | list | length) > 0)
    or
    ((desktop_file_removals.results
      | selectattr('changed')
      | selectattr('item.reload', 'equalto', 'voxtype')
      | list | length) > 0)
  notify: Reconcile VoxType service

- name: Queue sleep-lock service reconciliation
  ansible.builtin.debug:
    msg: Sleep lock integration changed
  changed_when: >-
    ((desktop_file_copies.results
      | selectattr('changed')
      | selectattr('item.reload', 'equalto', 'sleep-lock')
      | list | length) > 0)
    or
    ((desktop_file_removals.results
      | selectattr('changed')
      | selectattr('item.reload', 'equalto', 'sleep-lock')
      | list | length) > 0)
  notify: Restart sleep-lock service

- name: Deploy complete non-shell content trees
  ansible.builtin.include_tasks: owned-tree.yml
  loop: "{{ desktop_content_trees }}"
  loop_control:
    loop_var: tree
    label: "{{ tree.id }}"
  vars:
    defer_tree_cleanup: false

- name: Read Hyprland integration file
  ansible.builtin.slurp:
    path: "{{ expected_home }}/.config/hypr/hyprland.lua"
  register: hyprland_integration_source

- name: Remove the pre-Ansible Hyprland integration line
  ansible.builtin.replace:
    path: "{{ expected_home }}/.config/hypr/hyprland.lua"
    regexp: '(?m)^require\("hypr\.omarchy-utilities"\)\s*\n?'
    replace: ''
  when: >-
    '-- BEGIN ANSIBLE MANAGED: omarchy-utilities' not in
    (hyprland_integration_source.content | b64decode)
  notify: Reload Hyprland

- name: Manage the Hyprland integration block
  ansible.builtin.blockinfile:
    path: "{{ expected_home }}/.config/hypr/hyprland.lua"
    marker: "-- {mark} ANSIBLE MANAGED: omarchy-utilities"
    insertafter: EOF
    block: |
      require("hypr.omarchy-utilities")
  notify: Reload Hyprland

- name: Manage the XPS sleep-unlock lid binding
  ansible.builtin.blockinfile:
    path: "{{ expected_home }}/.config/hypr/bindings.lua"
    marker: "-- {mark} ANSIBLE MANAGED: andre.lock sleep unlock window"
    state: "{{ desktop_enable_sleep_unlock_window | ternary('present', 'absent') }}"
    insertafter: EOF
    block: |
      -- Replace the stock lid-close action while retaining its display handling.
      hl.unbind("switch:on:Lid Switch")
      o.bind("switch:on:Lid Switch", nil,
        os.getenv("HOME") .. "/.config/omarchy/plugins/andre.lock/sleep-dispatch lid",
        { locked = true })
  notify: Reload Hyprland

- name: Read Hyprland autostart file
  ansible.builtin.slurp:
    path: "{{ expected_home }}/.config/hypr/autostart.lua"
  register: hyprland_autostart_source

- name: Remove the pre-Ansible ChatGPT autostart line
  ansible.builtin.replace:
    path: "{{ expected_home }}/.config/hypr/autostart.lua"
    regexp: '(?m)^o\.launch_on_start\("chatgpt"\)\s*\n?'
    replace: ''
  when: >-
    '-- BEGIN ANSIBLE MANAGED: ChatGPT autostart' not in
    (hyprland_autostart_source.content | b64decode)
  notify: Reload Hyprland

- name: Manage ChatGPT autostart
  ansible.builtin.blockinfile:
    path: "{{ expected_home }}/.config/hypr/autostart.lua"
    marker: "-- {mark} ANSIBLE MANAGED: ChatGPT autostart"
    insertafter: EOF
    block: |
      o.launch_on_start("chatgpt")
  notify: Reload Hyprland

- name: Read desktop Bash configuration
  ansible.builtin.slurp:
    path: "{{ expected_home }}/.bashrc"
  register: desktop_bashrc_source

- name: Remove the pre-Ansible Codex terminal block
  ansible.builtin.replace:
    path: "{{ expected_home }}/.bashrc"
    regexp: '(?ms)^if \[\[ -z \$\{TMUX-\}.*?^fi\s*\n'
    replace: ''
  when: >-
    '# BEGIN ANSIBLE MANAGED: Codex terminal shortcuts' not in
    (desktop_bashrc_source.content | b64decode)

- name: Manage desktop Codex terminal shortcuts
  ansible.builtin.blockinfile:
    path: "{{ expected_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: Codex terminal shortcuts"
    insertafter: '^\[\[ \$- != \*i\* \]\] && return$'
    block: |
      if [[ -z ${TMUX-} && -t 0 && -t 1 && -r /proc/$PPID/comm &&
            -r "$HOME/.config/tmux/codex.conf" &&
            -x "$HOME/.local/libexec/codex-terminal-clipboard" ]] &&
         [[ $(</proc/$PPID/comm) == ChatGPT ]] && command -v tmux >/dev/null; then
        exec tmux -L codex-app-v2 -f "$HOME/.config/tmux/codex.conf" new-session
      fi

- name: Read GTK file chooser settings
  ansible.builtin.command:
    argv: [dconf, read, "{{ item.key }}"]
  loop: "{{ gtk_dconf_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: gtk_dconf_current
  changed_when: false
  failed_when: false
  check_mode: false

- name: Preview GTK file chooser setting changes
  ansible.builtin.debug:
    msg: "{{ item.item.key }} will be set to {{ item.item.value }}"
  loop: "{{ gtk_dconf_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: item.stdout | trim != item.item.value
  when: ansible_check_mode and item.stdout | trim != item.item.value

- name: Set GTK file chooser settings
  ansible.builtin.command:
    argv: [dconf, write, "{{ item.item.key }}", "{{ item.item.value }}"]
  loop: "{{ gtk_dconf_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - item.stdout | trim != item.item.value

- name: Inspect LocalSend preferences
  ansible.builtin.stat:
    path: "{{ expected_home }}/.local/share/org.localsend.localsend_app/shared_preferences.json"
  register: localsend_preferences

- name: Check LocalSend minimize-to-tray preference
  ansible.builtin.command:
    argv:
      - jq
      - -e
      - '."flutter.ls_minimize_to_tray" == true'
      - "{{ expected_home }}/.local/share/org.localsend.localsend_app/shared_preferences.json"
  register: localsend_minimize_preference
  changed_when: false
  failed_when: localsend_minimize_preference.rc not in [0, 1]
  check_mode: false
  no_log: true
  when: localsend_preferences.stat.exists

- name: Check whether LocalSend is running before preference repair
  ansible.builtin.command:
    argv: [pgrep, -x, localsend_app]
  register: localsend_process
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - localsend_preferences.stat.exists
    - localsend_minimize_preference.rc == 1

- name: Require LocalSend to be closed before changing private preferences
  ansible.builtin.assert:
    that:
      - ansible_check_mode or localsend_process.rc != 0
    fail_msg: >-
      Quit LocalSend after confirming no transfer is active, then rerun the
      deployment. The playbook will change only minimize-to-tray and will not
      expose or replace device identity, security, or history fields.
  when:
    - localsend_preferences.stat.exists
    - localsend_minimize_preference.rc == 1

- name: Preview LocalSend minimize-to-tray repair
  ansible.builtin.debug:
    msg: LocalSend minimize-to-tray will be enabled without displaying private preferences.
  changed_when: true
  when:
    - ansible_check_mode
    - localsend_preferences.stat.exists
    - localsend_minimize_preference.rc == 1

- name: Enable LocalSend minimize-to-tray privately
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      preference_file={{ (expected_home + '/.local/share/org.localsend.localsend_app/shared_preferences.json') | quote }}
      temporary=$(mktemp --tmpdir="$(dirname "$preference_file")" .shared_preferences.XXXXXX)
      trap 'rm -f -- "$temporary"' EXIT
      jq '."flutter.ls_minimize_to_tray" = true' "$preference_file" > "$temporary"
      chmod --reference="$preference_file" "$temporary"
      mv -- "$temporary" "$preference_file"
      trap - EXIT
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - localsend_preferences.stat.exists
    - localsend_minimize_preference.rc == 1

- name: Enable and start Darkman
  ansible.builtin.systemd_service:
    name: darkman.service
    scope: user
    enabled: true
    state: started

- name: Enable and start the backup timer
  ansible.builtin.systemd_service:
    name: omarchy-backup.timer
    scope: user
    enabled: true
    state: started

- name: Enable and start XPS VoxType
  ansible.builtin.systemd_service:
    name: voxtype-deepgram.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  when: desktop_enable_voxtype

- name: Inspect the deferred Grace VoxType unit
  ansible.builtin.command:
    argv: [systemctl, --user, list-unit-files, voxtype-deepgram.service, --no-legend]
  register: grace_voxtype_unit
  changed_when: false
  failed_when: false
  check_mode: false
  when: not desktop_enable_voxtype

- name: Stop and disable deferred Grace VoxType
  ansible.builtin.systemd_service:
    name: voxtype-deepgram.service
    scope: user
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not desktop_enable_voxtype
    - grace_voxtype_unit.stdout | trim != ''
