---
- name: Reload Hyprland
  ansible.builtin.command:
    argv: [hyprctl, reload]
  changed_when: true
  notify: Check Hyprland configuration errors
  when: not ansible_check_mode

- name: Check Hyprland configuration errors
  ansible.builtin.command:
    argv: [hyprctl, configerrors]
  register: hyprland_config_errors
  changed_when: false
  failed_when: hyprland_config_errors.stdout | trim != ''
  when: not ansible_check_mode

- name: Restart hyprsunset
  ansible.builtin.command:
    argv: [omarchy, restart, hyprsunset]
  changed_when: true
  when: not ansible_check_mode

- name: Restart Darkman
  ansible.builtin.systemd_service:
    name: darkman.service
    scope: user
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Restart backup timer
  ansible.builtin.systemd_service:
    name: omarchy-backup.timer
    scope: user
    daemon_reload: true
    enabled: true
    state: restarted
  when: not ansible_check_mode

- name: Restart GTK portal
  ansible.builtin.systemd_service:
    name: xdg-desktop-portal-gtk.service
    scope: user
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Reconcile VoxType service
  ansible.builtin.systemd_service:
    name: voxtype-deepgram.service
    scope: user
    daemon_reload: true
    state: restarted
  when:
    - not ansible_check_mode
    - desktop_enable_voxtype

- name: Restart sleep-lock service
  ansible.builtin.systemd_service:
    name: omarchy-sleep-lock.service
    scope: user
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode

- name: Restart Atop recording
  become: true
  block:
    - name: Reload systemd after Atop changes
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart enabled Atop units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - atopacct.service
        - atop.service
        - atop-rotate.timer
  when: not ansible_check_mode
